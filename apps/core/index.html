<!doctype html>

<head>
	<meta charset="UTF-8" />
	<!-- 不自动检查电话号码 -->
	<meta name="format-detection" content="telephone=no" />
	<!-- 手机端网页不显示地址栏 -->
	<meta name="mobile-web-app-capable" content="yes" />
	<!-- 禁止缩放 手机端全屏 -->
	<meta name="viewport" content="user-scalable=no, viewport-fit=cover" />
	<title>无名杀</title>
	<style>
		body {
			margin: 0;
			background: #1a1a2e;
		}
		#login-gate {
			position: fixed;
			top: 0; left: 0; right: 0; bottom: 0;
			background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
			display: none;
			align-items: center;
			justify-content: center;
			z-index: 999999;
			font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
		}
		#login-gate.visible { display: flex; }
		#login-gate.hidden { display: none; }
		#login-box {
			background: rgba(255, 255, 255, 0.08);
			backdrop-filter: blur(12px);
			border: 1px solid rgba(255, 255, 255, 0.15);
			border-radius: 16px;
			padding: 40px 36px;
			text-align: center;
			min-width: 300px;
			box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
		}
		#login-box h2 {
			color: #e0e0e0;
			margin: 0 0 24px 0;
			font-size: 22px;
			font-weight: 500;
		}
		#login-box input {
			width: 100%;
			padding: 12px 16px;
			border: 1px solid rgba(255, 255, 255, 0.2);
			border-radius: 8px;
			background: rgba(255, 255, 255, 0.06);
			color: #fff;
			font-size: 16px;
			outline: none;
			box-sizing: border-box;
			transition: border-color 0.2s;
		}
		#login-box input:focus {
			border-color: rgba(100, 180, 255, 0.6);
		}
		#login-box input::placeholder { color: rgba(255, 255, 255, 0.35); }
		#login-box button {
			width: 100%;
			margin-top: 16px;
			padding: 12px;
			border: none;
			border-radius: 8px;
			background: linear-gradient(135deg, #667eea, #764ba2);
			color: #fff;
			font-size: 16px;
			cursor: pointer;
			transition: opacity 0.2s;
		}
		#login-box button:hover { opacity: 0.85; }
		#login-error {
			color: #ff6b6b;
			font-size: 14px;
			margin-top: 12px;
			min-height: 20px;
		}
	</style>
	<script>
		"use strict";
		(() => {
			window.onerror = function (msg, src, line, column, err) {
				let str = `错误文件: ${typeof src == "string" && src.length > 0 ? decodeURI(src) : "未知文件"}`;
				str += `\n错误信息: ${msg}`;
				str += `\n行号: ${line}`;
				str += `\n列号: ${column}`;
				if (err && err.stack) str += "\n" + decodeURI(err.stack);
				console.error(str);
				alert(str);
			};
			const STACK_REGEXP = /^\s*at .*(\S+:\d+|\(native\))/m;
			const errorList = [];
			function extractLocation(urlLike) {
				// 不存在地址信息的字符串
				if (!/:/.test(urlLike)) {
					return [urlLike];
				}

				// 捕获位置用到的正则
				const regExp = /(.+?)(?::(\d+))?(?::(\d+))?$/;
				const parts = regExp.exec(urlLike.replace(/[()]/g, ""));

				// @ts-ignore
				return [parts[1], parts[2] || void 0, parts[3] || void 0];
			}
			window.onunhandledrejection = async event => {
				event.promise.catch(error => {
					console.log(error);
					// 如果`error`是个错误，则继续处理
					if (error instanceof Error) {
						// 如果已经处理过该错误，则不再处理
						if (errorList.includes(error)) return;
						errorList.push(error);
						// 如果`error`拥有字符串形式的报错栈堆，且报错栈堆确实符合v8的stack
						if (typeof error.stack === "string" && STACK_REGEXP.test(error.stack)) {
							// 获取符合栈堆信息的字符串，一般来说就是从第二行开始的所有行
							// 为了处理eval的情况，故必须获取完行数
							let lines = error.stack.split("\n").filter(line => STACK_REGEXP.test(line));

							// 提供类型信息防止vscode报错
							/**
							 * @type {string | undefined}
							 */
							let fileName = void 0;

							/**
							 * @type {number | undefined}
							 */
							let line = void 0;

							/**
							 * @type {number | undefined}
							 */
							let column = void 0;

							// 从第一条开始遍历，一直遍历到不存在eval的位置
							for (let currentLine = 0; currentLine < lines.length; ++currentLine) {
								if (/\(eval /.test(lines[currentLine])) continue;

								let formatedLine = lines[currentLine]
									.replace(/^\s+/, "")
									.replace(/\(eval code/g, "(")
									.replace(/^.*?\s+/, "");

								const location = formatedLine.match(/ (\(.+\)$)/);
								if (location) formatedLine = formatedLine.replace(location[0], "");

								const locationParts = extractLocation(location ? location[1] : formatedLine);

								fileName = ["eval", "<anonymous>"].includes(locationParts[0]) ? void 0 : locationParts[0];
								line = Number(locationParts[1]);
								column = Number(locationParts[2]);
								break;
							}

							// @ts-ignore
							window.onerror(error.message, fileName, line, column, error);
						}
						// 反之我们只能不考虑报错文件信息，直接调用onerror
						else {
							try {
								// @ts-ignore
								let [_, src = void 0, line = void 0, column = void 0] = /at\s+.*\s+\((.*):(\d*):(\d*)\)/i.exec(error.stack.split("\n")[1]);
								if (typeof line == "string") line = Number(line);
								if (typeof column == "string") column = Number(column);
								// @ts-ignore
								window.onerror(error.message, src, line, column, error);
							} catch (e) {
								window.onerror(error.message, "", 0, 0, error);
							}
						}
					}
				});
			};
		})();
	</script>
	<script>
		// ====== 登录验证配置 ======
		// 设置访问密码: 修改下面的 SHA-256 哈希值
		// 默认密码: 666888
		// 生成新哈希: 浏览器控制台运行
		//   crypto.subtle.digest("SHA-256", new TextEncoder().encode("你的密码")).then(b => console.log(Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,"0")).join("")))
		const PASSWORD_HASH = "6d19ca72de1fe7973e5a763cdbaf47af34674d4f45a8a2cacd881b751d680a4f";
		// 设为 false 可关闭登录验证
		const AUTH_ENABLED = true;
		// ====== 配置结束 ======

		async function sha256(text) {
			const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
			return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
		}

		let gameLoaded = false;
		function loadGame() {
			if (gameLoaded) return;
			gameLoaded = true;
			const gate = document.getElementById("login-gate");
			if (gate) gate.classList.remove("visible");
			const s = document.createElement("script");
			s.type = "module";
			s.src = "./noname/entry.ts";
			document.head.appendChild(s);
		}

		(function checkAuth() {
			if (!AUTH_ENABLED) { loadGame(); return; }
			if (localStorage.getItem("noname_auth") === PASSWORD_HASH) { loadGame(); return; }
			// 需要验证，显示登录界面
			document.addEventListener("DOMContentLoaded", () => {
				const gate = document.getElementById("login-gate");
				if (gate) gate.classList.add("visible");
			});
		})();

		async function doLogin() {
			const input = document.getElementById("login-pwd");
			const error = document.getElementById("login-error");
			const pwd = input.value.trim();
			if (!pwd) { error.textContent = "请输入密码"; return; }
			const hash = await sha256(pwd);
			if (hash === PASSWORD_HASH) {
				localStorage.setItem("noname_auth", hash);
				loadGame();
			} else {
				error.textContent = "密码错误";
				input.value = "";
				input.focus();
			}
		}
	</script>
</head>

<body>
	<div id="login-gate">
		<div id="login-box">
			<h2>无名杀 - 访问验证</h2>
			<input type="password" id="login-pwd" placeholder="请输入访问密码" autofocus
				onkeydown="if(event.key==='Enter')doLogin()" />
			<button onclick="doLogin()">进入游戏</button>
			<div id="login-error"></div>
		</div>
	</div>
</body>
